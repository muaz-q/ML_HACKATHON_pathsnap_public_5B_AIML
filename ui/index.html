<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0a0b0d; --panel: #111317; --panel-2: #16191e; --line: #23272e; --line-2: #2e333b;
  --ink: #e7e9ee; --muted: #8b93a1; --dim: #5d6573;
  --accent: #ff4d4f; --accent-soft: rgba(255,77,79,.14);
  --blue: #4c9aff; --amber: #f5a524; --green: #3ddc97; --net: #3a414c;
  --radius: 10px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
       -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
/* top bar */
header { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line);
         background: linear-gradient(180deg, #0f1114, #0a0b0d); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
.mark { width: 22px; height: 22px; border-radius: 6px; background: conic-gradient(from 200deg, var(--accent), #ff9a62, var(--accent));
        box-shadow: 0 0 18px rgba(255,77,79,.45); }
.brand span { color: var(--muted); font-weight: 500; }
.apibox { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 999px; padding: 4px 4px 4px 12px; }
.apibox input { background: transparent; border: 0; outline: 0; color: var(--ink); width: 210px; font-family: var(--mono); font-size: 12.5px; }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 6px 14px; cursor: pointer;
       transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { background: #1d2127; border-color: #3a404a; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: #0a0b0d; border-color: var(--ink); font-weight: 600; }
.btn.primary:hover { background: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.dot.ok { background: var(--green); box-shadow: 0 0 10px var(--green); }
.dot.err { background: var(--accent); }
.dot.busy { background: var(--amber); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
/* layout */
main { display: grid; grid-template-columns: 280px 1fr 340px; height: calc(100vh - 56px); }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.right { border-right: 0; border-left: 1px solid var(--line); overflow: auto; padding: 16px; }
.sect { font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
.side-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.search { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; color: var(--ink); outline: 0; }
.search:focus { border-color: var(--line-2); }
.row { display: flex; gap: 8px; margin-top: 8px; }
.row .btn { flex: 1; font-size: 12.5px; padding: 6px 10px; }
#trips { overflow: auto; padding: 8px; flex: 1; }
.trip { width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; text-align: left; padding: 9px 11px;
        margin-bottom: 4px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; transition: background .12s, border-color .12s; }
.trip:hover { background: var(--panel-2); }
.trip.active { background: var(--accent-soft); border-color: rgba(255,77,79,.4); }
.trip .id { font-family: var(--mono); font-size: 13px; }
.trip .n { color: var(--dim); font-size: 12px; grid-column: 1; }
.trip .score { grid-row: 1 / span 2; grid-column: 2; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.trip .score.good { color: var(--green); }
.trip .score.run { color: var(--amber); }
/* map */
#mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: #0d0f12; }
.leaflet-container { background: #0d0f12; font: inherit; }
.leaflet-control-attribution { background: rgba(10,11,13,.7) !important; color: var(--dim) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }
.floating { position: absolute; z-index: 500; background: rgba(17,19,23,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line); border-radius: var(--radius); }
#layers { top: 12px; right: 12px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.chip { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px; user-select: none;
        border: 0; background: transparent; color: var(--muted); text-align: left; }
.chip:hover { background: rgba(255,255,255,.04); }
.chip.on { color: var(--ink); }
.chip i { width: 16px; height: 3px; border-radius: 2px; opacity: .35; }
.chip.on i { opacity: 1; }
#loader { left: 50%; top: 16px; transform: translateX(-50%); padding: 9px 14px; display: none; align-items: center; gap: 10px; font-size: 13px; }
#loader.show { display: flex; }
.spin { width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
#empty { inset: 0; position: absolute; z-index: 400; display: grid; place-items: center; color: var(--dim); pointer-events: none; text-align: center; }
#empty b { display: block; color: var(--muted); font-size: 15px; margin-bottom: 4px; font-weight: 600; }
#replay { left: 12px; bottom: 12px; padding: 8px 10px; display: none; align-items: center; gap: 10px; font-size: 12.5px; }
#replay.show { display: flex; }
#replay input[type=range] { width: 220px; accent-color: var(--accent); }
#replay .t { font-family: var(--mono); color: var(--muted); min-width: 92px; }
/* results */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; }
.kpi .l { font-size: 11.5px; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.3px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 11.5px; color: var(--dim); font-family: var(--mono); }
.kpi.hero { grid-column: 1 / -1; background: linear-gradient(135deg, rgba(255,77,79,.16), rgba(255,77,79,.02)); border-color: rgba(255,77,79,.35); }
.kpi.hero .v { font-size: 34px; }
.up { color: var(--green); }
.cmp { margin-top: 18px; }
.bar-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 12.5px; }
.bar-row .name { color: var(--muted); }
.bars { display: grid; gap: 3px; }
.bar { height: 7px; border-radius: 4px; background: var(--panel-2); position: relative; overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; transition: width .6s cubic-bezier(.2,.8,.2,1); width: 0; }
.bar.c > span { background: var(--amber); } .bar.h > span { background: var(--accent); }
.bar-vals { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
.legend-mini { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
.legend-mini i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.timing { margin-top: 18px; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--panel-2); }
.stack span { transition: width .6s; }
.tl { display: grid; grid-template-columns: 1fr auto; font-size: 12.5px; color: var(--muted); margin-top: 8px; row-gap: 4px; }
.tl b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; }
.note { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 1.5; }
table.sum { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.sum td, table.sum th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
table.sum th { color: var(--dim); font-weight: 500; font-size: 11.5px; }
table.sum td:first-child, table.sum th:first-child { text-align: left; font-family: var(--mono); }
table.sum tr.total td { color: var(--ink); font-weight: 600; border-bottom: 0; }
.skel { height: 64px; border-radius: var(--radius); margin-bottom: 8px;
        background: linear-gradient(90deg, var(--panel-2) 0, #1c2026 50%, var(--panel-2) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.err { color: var(--accent); font-size: 13px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #22262d; border-radius: 10px; border: 3px solid var(--panel); }
@media (max-width: 1100px) { main { grid-template-columns: 240px 1fr; } .right { display: none; } }
@media (max-width: 720px) { body { overflow: auto; } main { grid-template-columns: 1fr; height: auto; } #mapwrap { height: 65vh; } .right { display: block; }
  .apibox input { width: 120px; } .brand span { display: none; } }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark"></div>PathSnap <span>/ map-matching evaluator</span></div>
  <div class="apibox">
    <input id="api" spellcheck="false" placeholder="http://laptop-1-ip:8000" aria-label="API URL">
    <button class="btn primary" id="connect">Connect</button>
  </div>
  <span class="pill"><span class="dot" id="sdot"></span><span id="status">Not connected</span></span>
</header>
<main>
  <aside>
    <div class="side-head">
      <div class="sect">Evaluation trips</div>
      <input class="search" id="filter" placeholder="Filter trips" aria-label="Filter trips">
      <div class="row"><button class="btn" id="runall" disabled>Run all</button><button class="btn" id="showsum" disabled>Summary</button></div>
    </div>
    <div id="trips"><div class="note" style="padding:6px">Connect to the API to load trips.</div></div>
    <div class="note" style="padding:10px 14px;border-top:1px solid var(--line);margin:0"><kbd>&uarr;</kbd> <kbd>&darr;</kbd> switch trip &nbsp; <kbd>R</kbd> replay</div>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="empty"><div><b>No trip selected</b>Pick a trip on the left to run it through the API.</div></div>
    <div class="floating" id="layers"></div>
    <div class="floating" id="loader"><div class="spin"></div><span id="ltext">Running</span></div>
    <div class="floating" id="replay"><button class="btn" id="play" style="padding:4px 12px">Play</button>
      <input type="range" id="scrub" min="0" max="0" value="0"><span class="t" id="ttext"></span></div>
  </div>
  <aside class="right" id="results"><div class="sect">Results</div><div class="note">Results for the selected trip appear here.</div></aside>
</main>
<script>
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
$("api").value = store.get("pathsnap_api") || "http://localhost:8000";
const api = () => $("api").value.trim().replace(/\/+$/, "");
const pct = x => x == null ? "–" : (100 * x).toFixed(2) + "%";
const f3 = x => x == null ? "–" : x.toFixed(3);

/* ---------- map: one canvas, one path per layer (fast) ---------- */
const canvas = L.canvas({ padding: 0.4, tolerance: 0 });
const map = L.map("map", { preferCanvas: true, renderer: canvas, zoomControl: true, attributionControl: true,
                           zoomSnap: 0.25, wheelPxPerZoomLevel: 90 }).setView([30, 10], 2);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Tiles &copy; Esri", maxZoom: 16, updateWhenZooming: false, keepBuffer: 2 }).addTo(map);

const LAYERS = [
  { key: "network", label: "Road network", color: "#5b6573", on: true },
  { key: "gps", label: "Raw GPS", color: "#4c9aff", on: true },
  { key: "clf", label: "Classifier only", color: "#f5a524", on: false },
  { key: "hmm", label: "HMM + Viterbi route", color: "#ff4d4f", on: true },
];
const state = Object.fromEntries(LAYERS.map(l => [l.key, l.on]));
let layers = {}, current = null, reqSeq = 0, timer = null;
const cache = new Map(), tripIds = [];

function renderChips() {
  $("layers").innerHTML = LAYERS.map(l =>
    `<button class="chip ${state[l.key] ? "on" : ""}" data-k="${l.key}"><i style="background:${l.color}"></i>${l.label}</button>`).join("");
  $("layers").querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const k = c.dataset.k; state[k] = !state[k]; c.classList.toggle("on", state[k]);
    if (layers[k]) state[k] ? layers[k].addTo(map) : map.removeLayer(layers[k]);
    if (k === "hmm" && layers.hmmGlow) state[k] ? layers.hmmGlow.addTo(map) : map.removeLayer(layers.hmmGlow);
  });
}
renderChips();

function clearMap() { Object.values(layers).forEach(l => map.removeLayer(l)); layers = {}; }

function draw(d) {
  clearMap();
  const opt = { renderer: canvas, interactive: false, smoothFactor: 1.2 };
  layers.network = L.polyline(d.network, { ...opt, color: "#5b6573", weight: 1, opacity: .55 });
  layers.gps = L.layerGroup(d.gps.map(p => L.circleMarker(p, { ...opt, radius: 2.2, stroke: false, fillColor: "#4c9aff", fillOpacity: .85 })));
  layers.clf = L.polyline(d.classifier_only_route, { ...opt, color: "#f5a524", weight: 3, opacity: .9, dashArray: "5 6" });
  layers.hmmGlow = L.polyline(d.predicted_route, { ...opt, color: "#ff4d4f", weight: 11, opacity: .16 });
  layers.hmm = L.polyline(d.predicted_route, { ...opt, color: "#ff4d4f", weight: 4, opacity: .95 });
  ["network", "gps", "clf"].forEach(k => state[k] && layers[k].addTo(map));
  if (state.hmm) { layers.hmmGlow.addTo(map); layers.hmm.addTo(map); }
  if (d.gps.length) map.fitBounds(L.latLngBounds(d.gps), { padding: [40, 40], animate: false });
  setupReplay(d);
}

/* ---------- replay: a marker moving along the GPS track ---------- */
let car = null, playing = false, raf = null;
function setupReplay(d) {
  stopPlay();
  if (car) map.removeLayer(car);
  car = L.circleMarker(d.gps[0], { renderer: canvas, radius: 7, color: "#fff", weight: 2, fillColor: "#ff4d4f", fillOpacity: 1, interactive: false });
  $("scrub").max = d.gps.length - 1; $("scrub").value = 0; setCar(d, 0);
  $("replay").classList.add("show");
}
function setCar(d, i) {
  car.setLatLng(d.gps[i]); if (!map.hasLayer(car)) car.addTo(map);
  $("ttext").textContent = `fix ${Math.round(i * d.n_obs / d.gps.length)} / ${d.n_obs}`;
}
function stopPlay() { playing = false; cancelAnimationFrame(raf); $("play").textContent = "Play"; }
function togglePlay() {
  if (!current || !cache.get(current)) return;
  const d = cache.get(current);
  if (playing) return stopPlay();
  playing = true; $("play").textContent = "Pause";
  let i = +$("scrub").value; if (i >= d.gps.length - 1) i = 0;
  const step = Math.max(1, d.gps.length / 600);
  const tick = () => { if (!playing) return; i = Math.min(d.gps.length - 1, i + step);
    $("scrub").value = Math.round(i); setCar(d, Math.round(i));
    if (i >= d.gps.length - 1) return stopPlay(); raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
}
$("play").onclick = togglePlay;
$("scrub").oninput = e => { stopPlay(); const d = cache.get(current); if (d) setCar(d, +e.target.value); };

/* ---------- API ---------- */
function status(text, kind) { $("status").textContent = text; $("sdot").className = "dot " + (kind || ""); }

async function connect() {
  store.set("pathsnap_api", $("api").value); status("Connecting", "busy");
  cache.clear(); tripIds.length = 0;
  try {
    const r = await fetch(api() + "/trips"); if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    status(`Connected · ${data.trips.length} trips · ${data.eval_dir}`, "ok");
    $("trips").innerHTML = data.trips.map(t => { tripIds.push(t.trip_id);
      return `<button class="trip" data-id="${t.trip_id}"><span class="id">${t.trip_id}</span><span class="n">${t.n_obs.toLocaleString()} fixes</span><span class="score" id="s-${t.trip_id}">–</span></button>`; }).join("");
    $("trips").querySelectorAll(".trip").forEach(b => b.onclick = () => select(b.dataset.id));
    $("runall").disabled = false;
  } catch (e) { status("Connection failed: " + e.message, "err"); }
}

async function fetchTrip(id) {
  if (cache.has(id)) return cache.get(id);
  const r = await fetch(api() + "/predict", { method: "POST", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ trip_id: id }) });
  if (!r.ok) throw new Error(await r.text());
  const d = await r.json(); d._rtt = 0; cache.set(id, d); markScore(id, d); return d;
}
function markScore(id, d) {
  const s = $("s-" + id); if (!s) return;
  s.className = "score " + (d && d.metrics ? "good" : ""); s.textContent = d && d.metrics ? pct(d.metrics.hmm_top1) : "done";
  $("showsum").disabled = cache.size === 0;
}

async function select(id) {
  const my = ++reqSeq; current = id; stopPlay();
  document.querySelectorAll(".trip").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  document.querySelector(`.trip[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
  $("empty").style.display = "none";
  const cached = cache.has(id);
  if (!cached) { showLoading(id); $("s-" + id).className = "score run"; $("s-" + id).textContent = "running"; }
  const t0 = performance.now();
  try {
    const d = await fetchTrip(id);
    if (!cached) d._rtt = (performance.now() - t0) / 1000;
    if (my !== reqSeq) return;               // a newer click won: never draw a stale trip
    hideLoading(); draw(d); showResults(d, cached);
  } catch (e) {
    if (my !== reqSeq) return;
    hideLoading(); $("s-" + id).textContent = "error";
    $("results").innerHTML = `<div class="sect">Results</div><div class="err">Error: ${e.message}</div>`;
  }
}

function showLoading(id) {
  const t0 = performance.now(); clearInterval(timer);
  $("loader").classList.add("show");
  const tick = () => $("ltext").textContent = `Running trip ${id} on the API · ${((performance.now() - t0) / 1000).toFixed(1)} s`;
  tick(); timer = setInterval(tick, 100);
  $("results").innerHTML = `<div class="sect">Results</div><div class="skel" style="height:96px"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="height:140px"></div>`;
}
function hideLoading() { clearInterval(timer); $("loader").classList.remove("show"); }

function bar(name, c, h, invert) {
  const w = v => Math.max(2, Math.min(100, 100 * (invert ? Math.min(1, v) : v)));
  return `<div class="bar-row"><div class="name">${name}</div><div class="bars">
    <div class="bar c"><span data-w="${w(c)}"></span></div><div class="bar h"><span data-w="${w(h)}"></span></div>
    <div class="bar-vals"><span>${invert ? f3(c) : pct(c)}</span><span style="color:var(--ink)">${invert ? f3(h) : pct(h)}</span></div></div></div>`;
}

function showResults(d, cached) {
  const m = d.metrics, t = d.timings;
  if (!m) { $("results").innerHTML = `<div class="sect">Results · ${d.trip_id}</div><div class="note">Route drawn. No reference route is available for this trip, so no score.</div>`; return; }
  const gain = 100 * (m.hmm_top1 - m.classifier_top1);
  const parts = [["Features", t.features_s, "#4c9aff"], ["Classifier", t.classifier_s, "#f5a524"], ["HMM / Viterbi", t.hmm_s, "#ff4d4f"]];
  const tot = parts.reduce((a, p) => a + p[1], 0) || 1;
  $("results").innerHTML = `
    <div class="sect">Results · trip ${d.trip_id}</div>
    <div class="kpis">
      <div class="kpi hero"><div class="l">Point-wise accuracy, HMM</div><div class="v">${pct(m.hmm_top1)}</div>
        <div class="d"><span class="up">${gain >= 0 ? "+" : ""}${gain.toFixed(2)} pts</span> vs classifier only · ${m.n_reliable_obs.toLocaleString()} fixes scored</div></div>
      <div class="kpi"><div class="l">Route arc F1</div><div class="v">${f3(m.hmm_arc_f1)}</div><div class="d">was ${f3(m.classifier_arc_f1)}</div></div>
      <div class="kpi"><div class="l">Length error</div><div class="v">${f3(m.hmm_length_error)}</div><div class="d">was ${f3(m.classifier_length_error)}</div></div>
      <div class="kpi"><div class="l">Continuity</div><div class="v">${pct(m.hmm_continuity)}</div><div class="d">drivable steps</div></div>
      <div class="kpi"><div class="l">Server time</div><div class="v">${t.request_total_s.toFixed(2)}s</div><div class="d">${cached ? "cached in browser" : "round trip " + (d._rtt || 0).toFixed(2) + "s"}</div></div>
    </div>
    <div class="cmp"><div class="sect">Classifier vs HMM</div>
      <div class="legend-mini"><span><i style="background:var(--amber)"></i>Classifier only</span><span><i style="background:var(--accent)"></i>Classifier + HMM</span></div>
      ${bar("Top-1 accuracy", m.classifier_top1, m.hmm_top1)}
      ${bar("Arc precision", m.classifier_arc_precision, m.hmm_arc_precision)}
      ${bar("Arc recall", m.classifier_arc_recall, m.hmm_arc_recall)}
      ${bar("Arc F1", m.classifier_arc_f1, m.hmm_arc_f1)}
      ${bar("Continuity", m.classifier_continuity, m.hmm_continuity)}
      ${bar("Length error", m.classifier_length_error, m.hmm_length_error, true)}
    </div>
    <div class="timing"><div class="sect">Where the time goes</div>
      <div class="stack">${parts.map(p => `<span style="width:${100 * p[1] / tot}%;background:${p[2]}"></span>`).join("")}</div>
      <div class="tl">${parts.map(p => `<span><span class="sw" style="background:${p[2]}"></span>${p[0]}</span><b>${p[1].toFixed(2)}s</b>`).join("")}
        <span>GPS gap breaks</span><b>${d.hmm_info.n_breaks}</b></div></div>
    <div class="note">The reference route is read by the API only after prediction, to compute these scores. It is never sent to this page.</div>`;
  requestAnimationFrame(() => $("results").querySelectorAll(".bar > span").forEach(s => s.style.width = s.dataset.w + "%"));
}

async function runAll() {
  $("runall").disabled = true;
  for (const id of tripIds) {
    if (cache.has(id)) continue;
    $("s-" + id).className = "score run"; $("s-" + id).textContent = "running";
    $("runall").textContent = `Running ${[...cache.keys()].length + 1}/${tripIds.length}`;
    try { await fetchTrip(id); } catch (e) { $("s-" + id).textContent = "error"; }
  }
  $("runall").textContent = "Run all"; $("runall").disabled = false; showSummary();
}
function showSummary() {
  const rows = tripIds.filter(id => cache.get(id)?.metrics).map(id => [id, cache.get(id)]);
  if (!rows.length) return;
  let n = 0, c = 0, h = 0, f = 0;
  rows.forEach(([, d]) => { const m = d.metrics; n += m.n_reliable_obs; c += m.classifier_top1 * m.n_reliable_obs; h += m.hmm_top1 * m.n_reliable_obs; f += m.hmm_arc_f1; });
  $("results").innerHTML = `<div class="sect">Summary · ${rows.length} trips</div>
    <div class="kpis"><div class="kpi hero"><div class="l">Point-wise accuracy, HMM (all fixes pooled)</div><div class="v">${pct(h / n)}</div>
      <div class="d"><span class="up">+${(100 * (h - c) / n).toFixed(2)} pts</span> vs classifier only · ${n.toLocaleString()} fixes</div></div>
      <div class="kpi"><div class="l">Mean route arc F1</div><div class="v">${f3(f / rows.length)}</div></div>
      <div class="kpi"><div class="l">Classifier only</div><div class="v">${pct(c / n)}</div></div></div>
    <table class="sum" style="margin-top:14px"><tr><th>Trip</th><th>Fixes</th><th>Clf</th><th>HMM</th><th>F1</th></tr>
    ${rows.map(([id, d]) => { const m = d.metrics; return `<tr><td>${id}</td><td>${m.n_obs.toLocaleString()}</td><td>${pct(m.classifier_top1)}</td><td>${pct(m.hmm_top1)}</td><td>${f3(m.hmm_arc_f1)}</td></tr>`; }).join("")}
    </table><div class="note">Click a trip to open it on the map. Results are cached, so switching is instant.</div>`;
}

$("connect").onclick = connect;
$("api").addEventListener("keydown", e => { if (e.key === "Enter") connect(); });
$("runall").onclick = runAll;
$("showsum").onclick = showSummary;
$("filter").oninput = e => { const q = e.target.value.trim();
  document.querySelectorAll(".trip").forEach(b => b.style.display = b.dataset.id.includes(q) ? "" : "none"); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && tripIds.length) {
    e.preventDefault(); const i = tripIds.indexOf(current);
    select(tripIds[(i + (e.key === "ArrowDown" ? 1 : -1) + tripIds.length) % tripIds.length]);
  }
  if (e.key === "r" || e.key === "R") togglePlay();
});
// deep link: index.html?api=http://host:8000&trip=00000009
(async () => { const q = new URLSearchParams(location.search);
  if (q.get("api")) { $("api").value = q.get("api"); await connect(); if (q.get("trip") && tripIds.includes(q.get("trip"))) select(q.get("trip")); }
})();
</script>
</body>
</html>
